    background-size:cover;
    background-position:right center;
    transform-origin:center right;
    animation:breathe 22s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes breathe{ from{transform:scale(1)} to{transform:scale(1.035)} }

  /* Realce suave del durazno para el texto (izquierda) y marco vertical tenue */
  .bg-scrim{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      linear-gradient(100deg,
        rgba(var(--peach-rgb),.85) 0%, rgba(var(--peach-rgb),.34) 22%,
        rgba(var(--peach-rgb),0) 42%),
      linear-gradient(to bottom,
        rgba(var(--peach-rgb),.4) 0%, rgba(var(--peach-rgb),0) 15%,
        rgba(var(--peach-rgb),0) 85%, rgba(var(--peach-rgb),.4) 100%);
  }

  #bubbles{ position:fixed; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }

  /* ---------- Contenido ---------- */
  .wrap{
    position:relative; z-index:3; min-height:100svh;
    display:flex; flex-direction:column; padding:28px 16px;
  }
  .card{ position:relative; margin:auto; width:min(94vw,560px); }

  .stack{ position:relative; width:100%; display:grid; }
  .stack > *{ grid-area:1 / 1; }

  .intro{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    padding:12px 10px;
    transition:opacity .45s ease, transform .45s ease, filter .45s ease;
  }
  .intro.out{
    opacity:0;
    transform:translateY(-10px) scale(.985);
    filter:blur(3px);
  }

  .eyebrow{
    margin:0;
    font-weight:500;
    font-size:.68rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:rgba(82,60,16,.72);
  }
  .name{
    margin:0;
    font-family:var(--script);
    font-weight:400;
    font-size:clamp(3rem,14vw,4.7rem);
    line-height:1;
    max-width:100%;
    padding:0 4px;
    text-wrap:balance;
    color:#3b2a0d;
    text-shadow:0 1px 12px rgba(255,248,222,.46);
  }
  .prompt{
    margin:0 auto;
    max-width:27ch;
    min-height:3.2em;
    font-weight:400;
    font-size:.83rem;
    line-height:1.65;
    letter-spacing:.075em;
    text-transform:uppercase;
    color:rgba(58,42,15,.88);
    transition:opacity .22s ease;
  }
  .prompt.swap{ opacity:0; }
  .prompt.pop{ animation:promptPop .42s ease; }
  @keyframes promptPop{ 0%{transform:translateY(3px);opacity:.45} 100%{transform:none;opacity:1} }

  .btn{
    position:relative;
    cursor:pointer;
    font-family:var(--sans);
    font-weight:500;
    font-size:.73rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold-dk);
    background:rgba(255,250,240,.46);
    border:1px solid rgba(126,92,19,.72);
    border-radius:999px;
    padding:11px 22px;
    box-shadow:none;
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:transform .16s ease, background .22s ease, border-color .22s ease;
  }
  .btn:hover{ background:rgba(255,250,240,.68); border-color:var(--gold-dk); }
  .btn:active{ transform:scale(.97); }
  .btn.press{ animation:press .3s ease; }
  @keyframes press{ 0%,100%{transform:scale(1)} 50%{transform:scale(.96)} }
  .btn:focus-visible,
  .more-btn:focus-visible{ outline:1px solid var(--gold-dk); outline-offset:4px; }

  .message{
    position:relative;
    overflow:hidden;
    text-align:center;
    padding:30px 26px 26px;
    border-radius:20px;
    border:1px solid rgba(126,92,19,.18);
    background:rgba(255,250,240,.68);
    box-shadow:0 12px 34px rgba(87,59,8,.10);
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    transition:opacity .44s ease, transform .44s ease, filter .44s ease;
  }
  .message.out{
    opacity:0;
    transform:translateY(-12px) scale(.975);
    filter:blur(4px);
  }
  .message::before{
    content:"";
    position:absolute;
    inset:-22%;
    pointer-events:none;
    z-index:0;
    background:
      radial-gradient(circle at 22% 82%, rgba(185,131,43,.11) 0 2px, transparent 7px),
      radial-gradient(circle at 70% 72%, rgba(231,196,113,.18) 0 3px, transparent 10px),
      radial-gradient(circle at 46% 96%, rgba(126,92,19,.09) 0 2px, transparent 8px);
    background-size:105px 145px, 150px 180px, 120px 160px;
    filter:blur(3px);
    opacity:.64;
    animation:goldDust 15s linear infinite;
  }
  .message > *{ position:relative; z-index:1; }
  @keyframes goldDust{
    from{ transform:translate3d(0,16%,0); }
    to{ transform:translate3d(0,-16%,0); }
  }
  .message .ln{
    opacity:0;
    transform:translateY(9px);
    transition:opacity .65s ease, transform .65s ease;
  }
  .message .ln.show{ opacity:1; transform:none; }

  .preamble{
    margin:0 auto 19px;
    max-width:31ch;
    font-style:italic;
    font-weight:300;
    font-size:.92rem;
    line-height:1.65;
    color:rgba(106,80,21,.84);
  }
  .body{ display:flex; flex-direction:column; gap:14px; }
  .body p{
    margin:0 auto;
    max-width:35ch;
    font-weight:400;
    font-size:.95rem;
    line-height:1.72;
    letter-spacing:.005em;
    color:rgba(58,42,15,.93);
    text-wrap:pretty;
  }
  .closing{
    margin:24px 0 2px;
    font-style:italic;
    font-weight:300;
    font-size:.9rem;
    color:rgba(106,80,21,.78);
  }
  .firma{
    margin:0;
    font-family:var(--sans);
    font-weight:400;
    font-style:italic;
    font-size:.94rem;
    line-height:1.45;
    color:var(--gold-dk);
  }

  .more-wrap{ margin-top:21px; }
  .more-btn{
    appearance:none;
    border:1px solid rgba(126,92,19,.72);
    border-radius:999px;
    padding:9px 16px;
    background:rgba(255,250,240,.22);
    color:var(--gold-dk);
    font:500 .72rem var(--sans);
    letter-spacing:.055em;
    cursor:pointer;
    box-shadow:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:background .2s ease, transform .16s ease, border-color .2s ease;
  }
  .more-btn:hover{ background:rgba(255,250,240,.58); border-color:var(--gold-dk); }
  .more-btn:active{ transform:scale(.97); }

  .final-screen{
    display:flex;
    pointer-events:none;
    min-height:62svh;
    align-items:center;
    justify-content:center;
    padding:18px 6px;
    opacity:0;
    transform:translateY(14px) scale(.985);
    filter:blur(4px);
    transition:opacity .55s ease, transform .55s ease, filter .55s ease;
  }
  .final-screen.show{
    pointer-events:auto;
    opacity:1;
    transform:none;
    filter:none;
  }
  .final-card{
    width:min(82vw,300px);
    padding:25px 20px 23px;
    text-align:center;
    border:1px solid rgba(126,92,19,.22);
    border-radius:18px;
    background:rgba(255,250,240,.61);
    box-shadow:0 10px 30px rgba(87,59,8,.08);
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
  }
  .final-mark{
    display:block;
    width:28px;
    height:1px;
    margin:0 auto 17px;
    background:rgba(126,92,19,.52);
  }
  .final-card p{
    margin:0 0 8px;
    font-size:.86rem;
    line-height:1.6;
    color:rgba(58,42,15,.78);
  }
  .final-card strong{
    display:block;
    font-family:var(--sans);
    font-size:1rem;
    line-height:1.5;
    font-weight:500;
    color:#4a3510;
  }


  /* ---------- Acceso privado ---------- */
  .gate{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;
    padding:20px 14px;
    transition:opacity .42s ease, transform .42s ease, filter .42s ease;
  }
  .gate.out{
    opacity:0;
    transform:translateY(-10px) scale(.985);
    filter:blur(3px);
  }
  .gate-mark{
    width:30px;
    height:1px;
    background:rgba(126,92,19,.55);
    margin-bottom:2px;
  }
  .gate-kicker{
    margin:0;
    font-weight:500;
    font-size:.67rem;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:rgba(82,60,16,.70);
  }
  .gate-title{
    margin:0;
    font-family:var(--script);
    font-weight:400;
    font-size:clamp(3rem,14vw,4.5rem);
    line-height:1;
    color:#3b2a0d;
  }
  .gate-copy{
    margin:0 auto;
    max-width:31ch;
    font-size:.91rem;
    line-height:1.7;
    color:rgba(58,42,15,.86);
    text-wrap:pretty;
  }
  .gate-note{
    margin:0;
    font-size:.76rem;
    line-height:1.55;
    color:rgba(106,80,21,.72);
  }
  .code-step{
    width:min(100%,340px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    margin-top:2px;
    padding:18px 16px;
    border:1px solid rgba(126,92,19,.18);
    border-radius:18px;
    background:rgba(255,250,240,.46);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .code-sent{
    margin:0;
    max-width:30ch;
    font-size:.82rem;
    line-height:1.6;
    color:rgba(58,42,15,.82);
  }
  .code-sent strong{
    display:block;
    margin-top:3px;
    font-weight:500;
    color:var(--gold-dk);
    overflow-wrap:anywhere;
  }
  .code-input{
    width:174px;
    height:48px;
    border:1px solid rgba(126,92,19,.42);
    border-radius:13px;
    outline:none;
    background:rgba(255,255,255,.58);
    color:#3b2a0d;
    text-align:center;
    font:500 1.08rem var(--sans);
    letter-spacing:.34em;
    padding:0 10px 0 16px;
    -webkit-appearance:none;
    appearance:none;
    transition:border-color .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .code-input:focus{
    border-color:rgba(126,92,19,.78);
    background:rgba(255,255,255,.78);
    box-shadow:0 0 0 3px rgba(185,131,43,.09);
  }
  .code-error{
    min-height:1.4em;
    margin:0;
    font-size:.75rem;
    color:#7a421d;
  }
  .gate .btn,
  .code-step .btn{
    touch-action:manipulation;
  }
  .btn[disabled]{
    opacity:.58;
    cursor:default;
    transform:none !important;
  }
  .api-frame{
    position:absolute;
    width:1px;
    height:1px;
    border:0;
    opacity:0;
    pointer-events:none;
  }

  @media (max-width:600px){
    .wrap{ padding:18px 14px; }
    .card{ width:min(92vw,520px); }
    .intro{ gap:16px; }
    .message{ padding:27px 20px 24px; border-radius:19px; }
    .preamble{ font-size:.9rem; margin-bottom:17px; }
    .body{ gap:13px; }
    .body p{ font-size:.93rem; line-height:1.68; max-width:32ch; }
    .more-wrap{ margin-top:19px; }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-photo{ animation:none !important; }
    .message .ln{ transition:opacity .35s ease; transform:none; }
    .message, .final-screen, .intro{ transition:opacity .25s ease; filter:none; transform:none; }
  }
</style>

<div class="bg-photo" aria-hidden="true"></div>
<div class="bg-scrim" aria-hidden="true"></div>
<canvas id="bubbles" aria-hidden="true"></canvas>

<main class="wrap">
  <div class="card" id="card">
    <div class="stack">
      <section class="gate" id="gate">
        <span class="gate-mark" aria-hidden="true"></span>
        <p class="gate-kicker">Mensaje privado</p>
        <h1 class="gate-title">Para Judith</h1>
        <p class="gate-copy">Este mensaje es privado. Para continuar, confirma que eres tú.</p>
        <button class="btn" id="sendCodeBtn" type="button">Enviar código</button>
        <p class="gate-note" id="gateNote">Te enviaremos el código a tu correo.</p>

        <div class="code-step" id="codeStep" hidden>
          <p class="code-sent">El código fue enviado a:<strong>jalvacar@ucvvirtual.edu.pe</strong></p>
          <input
            class="code-input"
            id="codeInput"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            pattern="[0-9]*"
            aria-label="Código de acceso de 6 dígitos"
            placeholder="••••••"
          >
          <button class="btn" id="unlockBtn" type="button">Abrir mensaje</button>
          <p class="code-error" id="codeError" aria-live="polite"></p>
        </div>
      </section>

      <section class="intro" id="intro" hidden>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 class="name" id="name"></h1>
        <p class="prompt" id="prompt"></p>
        <button class="btn" id="btn" type="button"></button>
      </section>

      <section class="message" id="message" hidden>
        <p class="preamble ln" id="preamble"></p>
        <div class="body" id="body"></div>
        <p class="closing ln" id="closing"></p>
        <p class="firma ln" id="firma"></p>
        <div class="more-wrap ln" id="moreWrap">
          <button class="more-btn" id="moreBtn" type="button">¿Quieres ver más?</button>
        </div>
      </section>

      <section class="final-screen" id="finalScreen" hidden aria-live="polite">
        <div class="final-card">
          <span class="final-mark" aria-hidden="true"></span>
          <p>No hay nada más...</p>
          <strong>Mejor desbloquéame pe!</strong>
        </div>
      </section>
    </div>
  </div>
  <iframe class="api-frame" id="apiFrame" name="apiFrame" title="" aria-hidden="true"></iframe>
</main>

<script>
/* =====================================================================
   ✏️  EDITA AQUÍ — todo lo personalizable
   ===================================================================== */
const CONFIG = {
  saludo:   "Hola, Judith",
  eyebrow:  "Un mensaje para ti",
  prompt:   "Presiona el botón para ver el mensaje que tienes aquí",
  btn:      "Ver el mensaje",

  // Cada toque cambia el texto. El último toque abre el mensaje.
  pasos: [
    "Presiona un poquito más fuerte…",
    "Un poquito más…",
  ],

  preambulo: "No sabía cómo expresar esto… Espero sea una bonita manera…",

  // 💌 El mensaje (cada línea es un párrafo):
  mensaje: [
    "A pesar de que no me quieras hablar, a pesar de todas las cosas buenas y malas que hemos pasado…",
    "Quiero agradecerte por ser esa gran mujer hermosa que me dio los momentos más maravillosos de mi vida.",
    "Me hace mucha falta escuchar tu voz, tu sonrisa, tus ocurrencias. Sabes que eso me llena y me inspira mucho. Perdón por ser tan duro contigo; simplemente quise buscar tu bienestar, es lo que siempre he querido.",
    "Espero que algún día se te pase esta bronca y te vuelva a escuchar.",
  ],

  // Cierre:
  atentamente: "Atentamente,",
  firma:       "Bueno, ya sabes quién soy.",
};
/* ===================================================================== */

const $ = s => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Acceso privado / Apps Script ---------- */
const ACCESS = {
  endpoint: "https://script.google.com/macros/s/AKfycbylu2Iq8XSlEsw82LPdMIj4vtQRNjlhEEO65ETGPnuGuaHFC-JV3ixTn-1qSM2HjOQ9/exec",
  id: "judith_F7K29",
  correo: "jalvacar@ucvvirtual.edu.pe",
  sesion: (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : (Date.now().toString(36) + Math.random().toString(36).slice(2))
};

let accessToken = "";
let aperturaSolicitada = false;

function postAppsScript(datos){
  const form = document.createElement("form");
  form.method = "POST";
  form.action = ACCESS.endpoint;
  form.target = "apiFrame";
  form.style.display = "none";

  Object.entries(datos).forEach(([key,value])=>{
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = key;
    input.value = String(value ?? "");
    form.appendChild(input);
  });

  document.body.appendChild(form);
  form.submit();
  setTimeout(()=> form.remove(), 1200);
}

const gate = $("#gate");
const sendCodeBtn = $("#sendCodeBtn");
const codeStep = $("#codeStep");
const codeInput = $("#codeInput");
const unlockBtn = $("#unlockBtn");
const codeError = $("#codeError");
const gateNote = $("#gateNote");

sendCodeBtn.addEventListener("click", ()=>{
  sendCodeBtn.disabled = true;
  sendCodeBtn.textContent = "Enviando…";
  codeError.textContent = "";

  postAppsScript({
    id: ACCESS.id,
    evento: "enviar_codigo",
    sesion: ACCESS.sesion
  });
});

unlockBtn.addEventListener("click", validarCodigo);
codeInput.addEventListener("keydown", e=>{
  if(e.key === "Enter") validarCodigo();
});
codeInput.addEventListener("input", ()=>{
  codeInput.value = codeInput.value.replace(/\D/g, "").slice(0,6);
  codeError.textContent = "";
});

function validarCodigo(){
  const codigo = codeInput.value.trim();
  if(codigo.length !== 6){
    codeError.textContent = "Ingresa el código de 6 dígitos.";
    codeInput.focus();
    return;
  }

  unlockBtn.disabled = true;
  unlockBtn.textContent = "Verificando…";
  codeError.textContent = "";

  postAppsScript({
    id: ACCESS.id,
    evento: "validar_codigo",
    codigo,
    sesion: ACCESS.sesion
  });
}

function mostrarExperiencia(){
  gate.classList.add("out");
  burst(12);
  setTimeout(()=>{
    gate.hidden = true;
    intro.hidden = false;
    intro.classList.remove("out");
  }, reduce ? 160 : 420);
}

function avisarApertura(){
  if(!accessToken || aperturaSolicitada) return;
  aperturaSolicitada = true;
  postAppsScript({
    id: ACCESS.id,
    evento: "mensaje_abierto",
    token: accessToken,
    sesion: ACCESS.sesion
  });
}

window.addEventListener("message", event=>{
  const origenValido =
    event.origin === "https://script.google.com" ||
    /^https:\/\/[^/]*googleusercontent\.com$/.test(event.origin);

  if(!origenValido) return;

  const data = event.data;
  if(!data || data.origen !== "alerta-flores") return;

  if(data.tipo === "codigo_enviado"){
    sendCodeBtn.disabled = false;
    sendCodeBtn.textContent = "Reenviar código";
    gateNote.textContent = "Revisa tu correo e ingresa el código para continuar.";
    codeStep.hidden = false;
    setTimeout(()=> codeInput.focus(), 120);
    return;
  }

  if(data.tipo === "codigo_incorrecto"){
    unlockBtn.disabled = false;
    unlockBtn.textContent = "Abrir mensaje";
    codeError.textContent = "El código no es correcto. Inténtalo otra vez.";
    codeInput.select();
    return;
  }

  if(data.tipo === "acceso_correcto" && data.ok && data.token){
    accessToken = data.token;
    unlockBtn.disabled = false;
    unlockBtn.textContent = "Abrir mensaje";
    mostrarExperiencia();
    return;
  }

  if(data.tipo === "error"){
    sendCodeBtn.disabled = false;
    sendCodeBtn.textContent = "Enviar código";
    unlockBtn.disabled = false;
    unlockBtn.textContent = "Abrir mensaje";
    codeError.textContent = data.mensaje || "No se pudo completar la solicitud. Inténtalo nuevamente.";
  }
});

$("#eyebrow").textContent = CONFIG.eyebrow;
$("#name").textContent    = CONFIG.saludo;
$("#prompt").textContent  = CONFIG.prompt;
$("#btn").textContent     = CONFIG.btn;

const card=$("#card"), intro=$("#intro"), message=$("#message");
const promptEl=$("#prompt"), btn=$("#btn");

let step = 0;
const totalPasos = CONFIG.pasos.length;

function setPrompt(txt){
  promptEl.classList.add("swap");
  setTimeout(()=>{
    promptEl.textContent = txt;
    promptEl.classList.remove("swap");
    promptEl.classList.remove("pop"); void promptEl.offsetWidth; promptEl.classList.add("pop");
  }, 220);
}

btn.addEventListener("click", ()=>{
  btn.classList.remove("press"); void btn.offsetWidth; btn.classList.add("press");
  burst();
  if(step < totalPasos){ setPrompt(CONFIG.pasos[step]); step++; }
  else { openMessage(); }
});

function buildMessage(){
  $("#preamble").textContent  = CONFIG.preambulo;
  const body=$("#body"); body.innerHTML="";
  CONFIG.mensaje.forEach(p=>{ const el=document.createElement("p"); el.className="ln"; el.textContent=p; body.appendChild(el); });
  $("#closing").textContent   = CONFIG.atentamente;
  $("#firma").textContent     = CONFIG.firma;
}

function staggerIn(){
  const lns=[...message.querySelectorAll(".ln")];
  lns.forEach((el,i)=> setTimeout(()=> el.classList.add("show"), 120 + i*(reduce?120:300)));
}

function openMessage(){
  avisarApertura();
  buildMessage();
  intro.classList.add("out");
  burst(28);
  setTimeout(()=>{ intro.hidden = true; message.hidden = false; staggerIn(); }, 480);
}

const moreBtn = $("#moreBtn");
const finalScreen = $("#finalScreen");
moreBtn.addEventListener("click", ()=>{
  burst(10);
  message.classList.add("out");

  setTimeout(()=>{
    message.hidden = true;
    message.classList.remove("out");
    finalScreen.hidden = false;
    requestAnimationFrame(()=> requestAnimationFrame(()=> finalScreen.classList.add("show")));
  }, reduce ? 180 : 440);
});

/* ---------- Burbujas / puntos dorados ---------- */
const cv=$("#bubbles"), cx=cv.getContext("2d");
let W,H,DPR,sprite,parts=[];
function makeSprite(){
  const s=document.createElement("canvas"); const n=96; s.width=s.height=n;
  const c=s.getContext("2d"); const g=c.createRadialGradient(n/2,n/2,0,n/2,n/2,n/2);
  g.addColorStop(0,"rgba(255,238,170,0.95)");
  g.addColorStop(0.25,"rgba(231,196,113,0.72)");
  g.addColorStop(0.58,"rgba(185,131,43,0.34)");
  g.addColorStop(1,"rgba(185,131,43,0)");
  c.fillStyle=g; c.fillRect(0,0,n,n); return s;
}
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=cv.width=Math.floor(innerWidth*DPR); H=cv.height=Math.floor(innerHeight*DPR);
  cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px";
}
function mkPart(fromBottom){
  return { x:Math.random()*W, y: fromBottom ? H+Math.random()*40*DPR : Math.random()*H,
    r:(Math.random()*8+2.5)*DPR, vy:-(Math.random()*0.38+0.13)*DPR,
    drift:(Math.random()*0.5+0.2)*DPR, ph:Math.random()*Math.PI*2,
    sp:Math.random()*0.015+0.005, a:Math.random()*0.48+0.20 };
}
function init(){
  sprite=makeSprite();
  const count=reduce?16:Math.round(Math.min(42, innerWidth*innerHeight/17000));
  parts=Array.from({length:count},()=>mkPart(false));
}
function burst(n){
  n=n||10; for(let i=0;i<n;i++){ const p=mkPart(true); p.x=Math.random()*W; parts.push(p); }
  if(parts.length>140) parts.splice(0, parts.length-140);
}
function draw(){
  cx.clearRect(0,0,W,H);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    if(!reduce){ p.y+=p.vy; p.ph+=p.sp; p.x+=Math.sin(p.ph)*p.drift; }
    if(p.y < -30*DPR){ if(parts.length>60){ parts.splice(i,1); continue;} Object.assign(p, mkPart(true)); }
    const size=p.r*6;
    cx.globalAlpha=Math.max(0,Math.min(0.7, p.a*(0.7+Math.sin(p.ph)*0.3)));
    cx.drawImage(sprite, p.x-size/2, p.y-size/2, size, size);
  }
  cx.globalAlpha=1; requestAnimationFrame(draw);
}
resize(); init();
addEventListener("resize", ()=>{ resize(); init(); });
requestAnimationFrame(draw);
</script>
